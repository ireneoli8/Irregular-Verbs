<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#152642"><title>English Verb Cards</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#14233b;background:#f4f7fc}*{box-sizing:border-box}body{margin:0}header{background:#152642;color:white;padding:32px max(20px,calc((100vw - 1080px)/2))}header h1{margin:0 0 6px;font-size:clamp(27px,4vw,42px)}header p{margin:0;color:#cbd7ec}main{max-width:1080px;margin:auto;padding:24px 18px 60px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}button,input{font:inherit}button{border:0;border-radius:11px;padding:11px 15px;cursor:pointer;font-weight:650;background:#e1e9f7;color:#152642}button.primary{background:#3163df;color:white}button:focus-visible,input:focus-visible,.flash:focus-visible{outline:3px solid #f5a623;outline-offset:3px}input{padding:11px;border:1px solid #c6d2e4;border-radius:10px;min-width:180px;flex:1}.count{color:#52627b;margin:8px 0 18px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}.flash{height:190px;perspective:900px;cursor:pointer;border:0;background:transparent;padding:0;text-align:center}.inner{display:block;width:100%;height:100%;position:relative;transition:transform .5s;transform-style:preserve-3d;-webkit-transform-style:preserve-3d}.flash.flipped .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:15px;box-shadow:0 6px 22px #16284715;border:1px solid #d7e0ef;background:white}.front strong{font-size:31px;color:#224cb7}.front small{margin-top:15px;color:#697994}.back{transform:rotateY(180deg);background:#e6efff}.back strong{font-size:23px;color:#1e4db9}.back .translation{font-size:17px;margin-top:13px;color:#24334b}.back small{color:#60718d;margin-bottom:5px}.panel{margin:30px 0 0;padding:20px;border:1px solid #d5e0f0;border-radius:16px;background:white}.panel summary{font-weight:750;cursor:pointer}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:18px 0}.fields input{width:100%;min-width:0}.hint{font-size:13px;color:#60718d;line-height:1.5}.actions{display:flex;gap:10px;flex-wrap:wrap}.status{min-height:22px;color:#1b6c48;font-size:14px}.study{max-width:430px;margin:18px auto}.study .flash{height:270px;width:100%}.study .front strong{font-size:46px}.study-nav{display:flex;align-items:center;justify-content:center;gap:15px;margin-top:15px}.hidden{display:none!important}@media(prefers-reduced-motion:reduce){.inner{transition:none}}
</style></head><body><header><h1>English Verb Cards</h1><p>Irregular verbs · Tocca una carta per scoprire le risposte</p></header><main><div class="toolbar"><input id="search" aria-label="Cerca verbo" placeholder="🔎 Cerca un verbo…"><button id="shuffle">Mescola</button><button id="mode" class="primary">Studia una alla volta</button><button id="reset">Gira tutte sul davanti</button></div><p class="count" id="count"></p><div id="grid" class="grid"></div><div id="study" class="study hidden"><div id="studyCard"></div><div class="study-nav"><button id="prev">← Precedente</button><span id="position"></span><button id="next">Successiva →</button></div></div><details class="panel"><summary>✏️ Aggiungi e gestisci nuovi verbi</summary><p class="hint">I verbi aggiunti vengono salvati su questo dispositivo. Per pubblicarli a tutti gli studenti, esporta il file JSON e aggiorna l'elenco nel sito pubblicato (istruzioni nel README).</p><form id="addForm"><div class="fields"><input id="base" placeholder="Forma base (es. write)" required><input id="past" placeholder="Past simple (es. wrote)" required><input id="part" placeholder="Past participle (es. written)" required><input id="italian" placeholder="Italiano (es. scrivere)" required></div><div class="actions"><button class="primary" type="submit">+ Aggiungi verbo</button><button type="button" id="export">Esporta elenco JSON</button><button type="button" id="importButton">Importa elenco JSON</button><input type="file" id="importFile" accept=".json,application/json" class="hidden"><button type="button" id="clearCustom">Rimuovi verbi aggiunti</button></div><p id="status" class="status" role="status"></p></form></details></main><script>
const defaults=[
['be','was / were','been','essere'],['can','could','—','potere (essere capace di)'],['do','did','done','fare'],['go','went','gone','andare'],['have','had','had','avere'],['make','made','made','fare / creare'],['see','saw','seen','vedere'],['sell','sold','sold','vendere'],['tell','told','told','dire / raccontare'],['hear','heard','heard','sentire / udire'],['pay','paid','paid','pagare'],['say','said','said','dire'],['cost','cost','cost','costare'],['cut','cut','cut','tagliare'],['hit','hit','hit','colpire'],['hurt','hurt','hurt','ferire / fare male'],['let','let','let','lasciare / permettere'],['put','put','put','mettere'],['read','read','read','leggere'],['set','set','set','impostare / fissare'],['shut','shut','shut','chiudere'],['bring','brought','brought','portare'],['buy','bought','bought','comprare'],['catch','caught','caught','prendere / afferrare'],['fight','fought','fought','combattere'],['teach','taught','taught','insegnare'],['think','thought','thought','pensare'],['build','built','built','costruire'],['send','sent','sent','inviare'],['spend','spent','spent','spendere / trascorrere'],['smell','smelt / smelled','smelt / smelled','odorare / sentire un odore'],['burn','burnt / burned','burnt / burned','bruciare'],['deal','dealt','dealt','trattare / distribuire'],['dream','dreamt / dreamed','dreamt / dreamed','sognare'],['learn','learnt / learned','learnt / learned','imparare'],['mean','meant','meant','significare'],['feel','felt','felt','sentire / provare'],['keep','kept','kept','tenere / conservare'],['sleep','slept','slept','dormire'],['leave','left','left','partire / lasciare'],['lose','lost','lost','perdere']
];
const KEY='englishVerbCardsCustomV1';let custom=[];try{custom=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(custom))custom=[]}catch{}let order=[],single=false,index=0;const $=id=>document.getElementById(id);function all(){const map=new Map(defaults.map(v=>[v[0],v]));for(const v of custom)map.set(v[0],v);return [...map.values()]};function refreshOrder(){order=all().filter(v=>v.join(' ').toLowerCase().includes($('search').value.trim().toLowerCase()))};function card(v){const b=document.createElement('button');b.type='button';b.className='flash';b.setAttribute('aria-label',`Mostra le forme di ${v[0]}`);const inner=document.createElement('span');inner.className='inner';const front=document.createElement('span');front.className='face front';const strong=document.createElement('strong');strong.textContent=v[0].toUpperCase();const hint=document.createElement('small');hint.textContent='Tocca per girare';front.append(strong,hint);const back=document.createElement('span');back.className='face back';const cap=document.createElement('small');cap.textContent='PAST SIMPLE · PAST PARTICIPLE';const ans=document.createElement('strong');ans.textContent=`${v[1]} · ${v[2]}`;const tr=document.createElement('span');tr.className='translation';tr.textContent=v[3];back.append(cap,ans,tr);inner.append(front,back);b.append(inner);b.addEventListener('click',()=>{b.classList.toggle('flipped');b.setAttribute('aria-label',b.classList.contains('flipped')?`Nascondi le forme di ${v[0]}`:`Mostra le forme di ${v[0]}`)});return b};function render(){const grid=$('grid');grid.replaceChildren();$('studyCard').replaceChildren();$('count').textContent=`${order.length} verbi disponibili${single?' · modalità studio':''}`;$('grid').classList.toggle('hidden',single);$('study').classList.toggle('hidden',!single);$('mode').textContent=single?'Mostra tutte le carte':'Studia una alla volta';if(single){if(index>=order.length)index=Math.max(0,order.length-1);if(order.length)$('studyCard').append(card(order[index]));$('position').textContent=order.length?`${index+1} / ${order.length}`:'Nessun verbo';$('prev').disabled=index===0;$('next').disabled=index>=order.length-1}else{for(const v of order)grid.append(card(v))}}function reload(){refreshOrder();index=0;render()}$('search').addEventListener('input',reload);$('mode').onclick=()=>{single=!single;index=0;render()};$('shuffle').onclick=()=>{for(let i=order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}index=0;render()};$('reset').onclick=render;$('prev').onclick=()=>{index=Math.max(0,index-1);render()};$('next').onclick=()=>{index=Math.min(order.length-1,index+1);render()};$('addForm').onsubmit=e=>{e.preventDefault();const v=['base','past','part','italian'].map(id=>$(id).value.trim());v[0]=v[0].toLowerCase();if(v.some(x=>!x))return;custom=custom.filter(x=>x[0]!==v[0]);custom.push(v);localStorage.setItem(KEY,JSON.stringify(custom));$('addForm').reset();$('status').textContent=`Verbo “${v[0]}” salvato su questo dispositivo.`;reload()};$('clearCustom').onclick=()=>{if(confirm('Rimuovere tutti i verbi aggiunti su questo dispositivo?')){custom=[];localStorage.removeItem(KEY);$('status').textContent='Verbi aggiunti rimossi.';reload()}};$('export').onclick=()=>{const blob=new Blob([JSON.stringify(all(),null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='verbi.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('importButton').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!Array.isArray(data)||!data.every(v=>Array.isArray(v)&&v.length===4&&v.every(s=>typeof s==='string'&&s.trim())))throw Error('Formato non valido');custom=data.map(v=>[v[0].toLowerCase(),...v.slice(1)]);localStorage.setItem(KEY,JSON.stringify(custom));$('status').textContent='Elenco importato correttamente.';reload()}catch(err){$('status').textContent='Errore: '+err.message}e.target.value=''};reload();
</script></body></html>
